name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pointer-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Creates (or updates) the GitHub release v<version> with the .exe files attached.
      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pointer ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            release/Pointer-Setup-${{ steps.version.outputs.version }}.exe
            release/Pointer-${{ steps.version.outputs.version }}-portable.exe
          body: |
            **Pointer ${{ steps.version.outputs.version }}**: an AI code editor with a real coding agent, powered by Google Gemini and Groq.

            - `Pointer-Setup-${{ steps.version.outputs.version }}.exe`: installer (Start menu and desktop shortcuts)
            - `Pointer-${{ steps.version.outputs.version }}-portable.exe`: runs without installing

            The builds are not code-signed, so Windows SmartScreen may warn on first launch: click **More info → Run anyway**.
            Add your Google AI Studio key (new `AQ.` keys work) and/or Groq key in Settings → Models.
